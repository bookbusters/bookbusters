<div class="p-10">
  <h1 class="text-4xl font-bold">Today’s Picks 📊</h1>

  <div id="picks" class="grid md:grid-cols-3 gap-4 mt-8"></div>
</div>

<script>
const supabaseUrl = "https://hohtaltrqzqvehfqcplz.supabase.co"
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhvaHRhbHRycXpxdmVoZnFjcGx6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMTgwNDMsImV4cCI6MjA5Mzc5NDA0M30.qIq-DWZwdSIGBJSTzG-KseisJRPHFQaCoA2CQs38JQs"

const supabase = supabase.createClient(supabaseUrl, supabaseKey)

async function loadPicks() {
  const { data, error } = await supabase
    .from('picks')
    .select('*')
    .order('id', { ascending: false })

  if (error) {
    console.log(error)
    return
  }

  document.getElementById("picks").innerHTML = data.map(p => `
    <div class="bg-[#111827] p-5 rounded-xl border border-gray-800">
      <h2 class="font-bold">🏀 ${p.player}</h2>
      <p>${p.bet}</p>
      <p>${p.line}</p>
      <p class="text-green-400">${p.confidence}% confidence</p>
      <p class="text-gray-400">${p.risk}</p>
    </div>
  `).join("")
}

loadPicks()
</script>

</body>
</html>
