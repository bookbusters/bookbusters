<!DOCTYPE html>
<html>
<head>
  <title>BookBusters Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<body class="bg-[#0b0f19] text-white flex justify-center p-10">

<div class="w-full max-w-2xl">

  <h1 class="text-3xl font-bold mb-6">Paste Picks ⚡</h1>

  <!-- PASTE BOX -->
  <textarea id="input"
    class="w-full h-72 p-4 rounded-xl bg-[#111827] text-white"
    placeholder="Paste AI picks here..."></textarea>

  <!-- BUTTON -->
  <button onclick="publish()"
    class="mt-4 w-full bg-green-500 hover:bg-green-400 p-4 rounded-xl font-bold text-lg">
    Publish Picks 🚀
  </button>

  <div id="status" class="mt-4 text-green-400"></div>

</div>

<script>

const supabaseUrl = "https://hohtaltrqzqvehfqcplz.supabase.co"
const supabaseKey = "YOUR_ANON_KEY"
const supabase = supabase.createClient(supabaseUrl, supabaseKey)

async function publish() {

  const raw = document.getElementById("input").value.trim()
  if (!raw) return

  const lines = raw.split("\n")

  const picks = lines.map(line => {
    const parts = line.split("|")

    return {
      player: parts[0]?.trim(),
      bet: parts[1]?.trim(),
      line: parts[2]?.trim(),
      confidence: parts[3]?.trim(),
      risk: parts[4]?.trim()
    }
  })

  const { error } = await supabase.from("picks").insert(picks)

  if (error) {
    console.log(error)
    document.getElementById("status").innerText = "Error publishing ❌"
  } else {
    document.getElementById("status").innerText = "Published successfully ✅"
    document.getElementById("input").value = ""
  }
}

</script>

</body>
</html>
