<!DOCTYPE html>
<html>
<head>
  <title>BookBusters Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#0b0f19] text-white">

<div class="flex min-h-screen">

  <!-- SIDEBAR -->
  <div class="w-64 bg-[#0f172a] p-6">

    <h2 class="text-2xl font-bold mb-8">
      Book<span class="text-blue-500">Busters</span>
    </h2>

    <div class="space-y-4 text-sm">

      <button onclick="showPage('dashboard')" class="block text-left w-full text-white font-semibold">
        📊 Dashboard
      </button>

      <button onclick="showPage('picks')" class="block text-left w-full text-gray-300 hover:text-white">
        🏀 Picks
      </button>

      <button onclick="showPage('stats')" class="block text-left w-full text-gray-300 hover:text-white">
        📈 Stats
      </button>

      <button onclick="showPage('vip')" class="block text-left w-full text-gray-300 hover:text-white">
        🔒 VIP
      </button>

    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="flex-1 p-8">

    <!-- DASHBOARD VIEW -->
    <div id="dashboard" class="page">
      <h1 class="text-4xl font-bold mb-4">Dashboard</h1>

      <div class="grid md:grid-cols-3 gap-4">
        <div class="bg-[#111827] p-6 rounded-xl">
          <p class="text-gray-400">Win Rate</p>
          <h2 class="text-2xl text-green-400 font-bold">65%</h2>
        </div>

        <div class="bg-[#111827] p-6 rounded-xl">
          <p class="text-gray-400">ROI</p>
          <h2 class="text-2xl text-blue-400 font-bold">+12.4%</h2>
        </div>

        <div class="bg-[#111827] p-6 rounded-xl">
          <p class="text-gray-400">Total Picks</p>
          <h2 class="text-2xl font-bold">100+</h2>
        </div>
      </div>
    </div>

    <!-- PICKS VIEW -->
    <div id="picks" class="page hidden">
      <h1 class="text-4xl font-bold mb-6">Picks</h1>

      <div id="picksContainer" class="grid md:grid-cols-3 gap-4"></div>
    </div>

    <!-- STATS VIEW -->
    <div id="stats" class="page hidden">
      <h1 class="text-4xl font-bold">Stats</h1>
      <p class="text-gray-400 mt-4">Performance tracking coming soon.</p>
    </div>

    <!-- VIP VIEW -->
    <div id="vip" class="page hidden">
      <h1 class="text-4xl font-bold">VIP Access</h1>
      <p class="text-gray-400 mt-4">
        Premium picks, early access, and model insights coming soon.
      </p>
    </div>

  </div>
</div>

<script>
// PAGE SWITCHING SYSTEM
function showPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
  document.getElementById(page).classList.remove('hidden');

  if (page === 'picks') loadPicks();
}

// LOAD PICKS FROM JSON
async function loadPicks() {
  const res = await fetch('./picks.json');
  const data = await res.json();

  const container = document.getElementById("picksContainer");

  container.innerHTML = data.map(pick => `
    <div class="bg-[#111827] p-6 rounded-xl border border-gray-800">
      <h2 class="font-bold text-lg">${pick.title}</h2>
      <p class="text-gray-400 mt-2">${pick.sport}</p>

      <div class="mt-4">
        <span class="px-3 py-1 text-sm rounded-full bg-blue-600">
          ${pick.confidence}
        </span>
      </div>
    </div>
  `).join("");
}

// DEFAULT PAGE
showPage('dashboard');
</script>

</body>
</html>
