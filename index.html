<!DOCTYPE html>
<html>
<head>
  <title>BookBusters</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#0b0f19] text-white">

  <!-- HEADER -->
  <div class="text-center py-10">
    <h1 class="text-5xl font-extrabold tracking-tight">
      Book<span class="text-blue-500">Busters</span>
    </h1>
    <p class="text-gray-400 mt-2">Data-Driven NBA Player Props</p>
  </div>

  <!-- PICKS -->
  <div id="picks" class="max-w-5xl mx-auto grid md:grid-cols-3 gap-6 px-6"></div>

  <script>
    async function loadPicks() {
      const res = await fetch('./picks.json');
      const data = await res.json();

      const container = document.getElementById("picks");

      container.innerHTML = data.map(pick => `
        <div class="bg-[#111827] border border-gray-800 p-6 rounded-2xl hover:scale-105 transition">
          <h2 class="text-xl font-bold">${pick.title}</h2>
          <p class="text-gray-400 mt-2">${pick.sport}</p>

          <div class="mt-4">
            <span class="text-sm px-3 py-1 rounded-full bg-blue-600">
              ${pick.confidence}
            </span>
          </div>
        </div>
      `).join("");
    }

    loadPicks();
  </script>

</body>
</html>
